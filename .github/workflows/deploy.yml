name: Deploy

on:
  push:
    branches:
      - master   # → production
      - staging  # → staging

# Only one deployment per branch at a time.
# A new push cancels the in-flight deploy on that branch.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy (${{ github.ref_name == 'master' && 'production' || 'staging' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install admin-app dependencies
        run: cd admin-app && npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # ── Debug — confirm secrets are actually being injected ──────────────────
      # Reports the LENGTH of each secret, never the value. Lengths should be:
      #   AWS_DEPLOY_ACCESS_KEY_ID    = 20 (AKIA...)
      #   AWS_DEPLOY_SECRET_ACCESS_KEY = 40
      # If length is 0, the secret is missing or misnamed in GitHub.
      - name: Debug — verify secret presence
        run: |
          if [ -z "$KEY_ID" ]; then
            echo "::error::AWS_DEPLOY_ACCESS_KEY_ID is EMPTY — secret not found in GitHub. Check Settings → Secrets and variables → Actions → Secrets tab"
            exit 1
          fi
          if [ -z "$SECRET" ]; then
            echo "::error::AWS_DEPLOY_SECRET_ACCESS_KEY is EMPTY — secret not found in GitHub. Check Settings → Secrets and variables → Actions → Secrets tab"
            exit 1
          fi
          echo "AWS_DEPLOY_ACCESS_KEY_ID length: ${#KEY_ID} (expected 20)"
          echo "AWS_DEPLOY_SECRET_ACCESS_KEY length: ${#SECRET} (expected 40)"
        env:
          KEY_ID: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}

      # ── Configure AWS credentials ────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region:            us-east-1
          mask-aws-account-id:   true

      # ── Sanity check — proves the keys actually work against AWS ─────────────
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # ── Deploy ──────────────────────────────────────────────────────────────
      # master → production stage, any other branch → staging stage
      - name: Deploy to AWS
        run: npx sst deploy --stage ${{ github.ref_name == 'master' && 'production' || 'staging' }}
        env:
          # ── Domains (set in GitHub Variables, not Secrets — these are not sensitive) ─
          STORE_DOMAIN: ${{ vars.STORE_DOMAIN }}
          ADMIN_DOMAIN: ${{ vars.ADMIN_DOMAIN }}

          # ── Database ─────────────────────────────────────────────────────────
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          # ── Cognito (public IDs — can live in Variables) ─────────────────────
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID:    ${{ vars.NEXT_PUBLIC_COGNITO_CLIENT_ID }}

          # ── Paystack ─────────────────────────────────────────────────────────
          PAYSTACK_SECRET_KEY:             ${{ secrets.PAYSTACK_SECRET_KEY }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}

          # ── Email + SMS ───────────────────────────────────────────────────────
          GMAIL_USER:         ${{ vars.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ADMIN_PHONE:        ${{ vars.ADMIN_PHONE }}

          # ── Admin config ──────────────────────────────────────────────────────
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}

          # ── AWS services ──────────────────────────────────────────────────────
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_REGION: ${{ vars.S3_REGION }}

          # ── External APIs ─────────────────────────────────────────────────────
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          FAL_KEY:             ${{ secrets.FAL_KEY }}
