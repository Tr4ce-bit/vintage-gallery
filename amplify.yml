version: 1
frontend:
  phases:
    preBuild:
      commands:
        - |
          if [ "${BUILD_ADMIN}" = "true" ]; then
            cd admin-app
            npm ci
            echo "NEXT_PUBLIC_COGNITO_USER_POOL_ID=$NEXT_PUBLIC_COGNITO_USER_POOL_ID" >> .env.production
            echo "NEXT_PUBLIC_COGNITO_CLIENT_ID=$NEXT_PUBLIC_COGNITO_CLIENT_ID" >> .env.production
            echo "NEXT_PUBLIC_COGNITO_REGION=$NEXT_PUBLIC_COGNITO_REGION" >> .env.production
            echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" >> .env.production
            echo "NEXT_PUBLIC_ADMIN_EMAILS=$NEXT_PUBLIC_ADMIN_EMAILS" >> .env.production
            echo "NEXT_PUBLIC_STORE_URL=$NEXT_PUBLIC_STORE_URL" >> .env.production
          else
            npm ci
            echo "DATABASE_URL=$DATABASE_URL" >> .env.production
            echo "PAYSTACK_SECRET_KEY=$PAYSTACK_SECRET_KEY" >> .env.production
            echo "NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY=$NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY" >> .env.production
            echo "NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL" >> .env.production
            echo "NEXT_PUBLIC_COGNITO_USER_POOL_ID=$NEXT_PUBLIC_COGNITO_USER_POOL_ID" >> .env.production
            echo "NEXT_PUBLIC_COGNITO_CLIENT_ID=$NEXT_PUBLIC_COGNITO_CLIENT_ID" >> .env.production
            echo "NEXT_PUBLIC_COGNITO_REGION=$NEXT_PUBLIC_COGNITO_REGION" >> .env.production
            echo "ADMIN_EMAILS=$ADMIN_EMAILS" >> .env.production
            echo "NEXT_PUBLIC_ADMIN_EMAILS=$NEXT_PUBLIC_ADMIN_EMAILS" >> .env.production
            echo "GMAIL_USER=$GMAIL_USER" >> .env.production
            echo "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD" >> .env.production
            echo "ADMIN_PHONE=$ADMIN_PHONE" >> .env.production
            echo "AWS_S3_BUCKET=$AWS_S3_BUCKET" >> .env.production
            echo "AWS_S3_REGION=$AWS_S3_REGION" >> .env.production
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> .env.production
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> .env.production
            echo "FAL_KEY=$FAL_KEY" >> .env.production
            echo "GOOGLE_GEMINI_API_KEY=$GOOGLE_GEMINI_API_KEY" >> .env.production
            npx prisma generate
            npx prisma db push --skip-generate --accept-data-loss
            npx prisma db seed
          fi
    build:
      commands:
        - |
          if [ "${BUILD_ADMIN}" = "true" ]; then
            npm run build
            # Determine the relativeAppDir from Next.js build output.
            # Without outputFileTracingRoot, Next.js uses vintage-gallery/ as the
            # workspace root, so relativeAppDir="admin-app" and standalone output is:
            #   .next/standalone/admin-app/server.js
            #   .next/standalone/admin-app/node_modules/
            #   .next/standalone/admin-app/.next/
            REL=$(node -e "const d=require('./.next/required-server-files.json');process.stdout.write(d.relativeAppDir||'')")
            echo "relativeAppDir='${REL}'"
            SAPP=".next/standalone"
            if [ -n "${REL}" ]; then SAPP=".next/standalone/${REL}"; fi
            # Assemble a flat Lambda package at repo-root .next/ with no standalone/
            # subdir and no required-server-files.json. Without these SSR markers in
            # the artifact, Amplify does not detect "Next.js - SSR" and keeps the
            # branch framework as null, using the generic WEB_COMPUTE bootstrap which
            # simply runs node server.js — no read-only-FS symlink creation needed.
            rm -rf ../.next
            mkdir -p ../.next ../.next/.next/static
            cp    "${SAPP}/server.js"     ../.next/ || { echo "ERROR: server.js missing at ${SAPP}"; ls .next/standalone/; exit 1; }
            cp    "${SAPP}/package.json"  ../.next/ 2>/dev/null || true
            cp -r "${SAPP}/node_modules"  ../.next/
            cp -r "${SAPP}/.next/."       ../.next/.next/
            cp -r .next/static/.          ../.next/.next/static/ 2>/dev/null || true
            mkdir -p ../.next/public
            # Remove SSR markers from admin-app/.next/ so Amplify's post-build
            # artifact scan (which also checks the build CWD) finds no standalone/
            # directory and does not trigger "framework looks wrong" validation.
            rm -rf .next/standalone .next/required-server-files.json
          else
            npm run build
          fi
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
      - admin-app/node_modules/**/*
      - admin-app/.next/cache/**/*
