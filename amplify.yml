version: 1
frontend:
  phases:
    preBuild:
      commands:
        - |
          if [ "${BUILD_ADMIN}" = "true" ]; then
            # Install root deps first so Amplify's post-build bundler can find `next`
            # at the repo root (it resolves packages from there, not from admin-app/).
            npm ci
            cd admin-app
            npm ci
            echo "NEXT_PUBLIC_COGNITO_USER_POOL_ID=$NEXT_PUBLIC_COGNITO_USER_POOL_ID" >> .env.production
            echo "NEXT_PUBLIC_COGNITO_CLIENT_ID=$NEXT_PUBLIC_COGNITO_CLIENT_ID" >> .env.production
            echo "NEXT_PUBLIC_COGNITO_REGION=$NEXT_PUBLIC_COGNITO_REGION" >> .env.production
            echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" >> .env.production
            echo "NEXT_PUBLIC_ADMIN_EMAILS=$NEXT_PUBLIC_ADMIN_EMAILS" >> .env.production
            echo "NEXT_PUBLIC_STORE_URL=$NEXT_PUBLIC_STORE_URL" >> .env.production
          else
            npm ci
            echo "DATABASE_URL=$DATABASE_URL" >> .env.production
            echo "PAYSTACK_SECRET_KEY=$PAYSTACK_SECRET_KEY" >> .env.production
            echo "NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY=$NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY" >> .env.production
            echo "NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL" >> .env.production
            echo "NEXT_PUBLIC_COGNITO_USER_POOL_ID=$NEXT_PUBLIC_COGNITO_USER_POOL_ID" >> .env.production
            echo "NEXT_PUBLIC_COGNITO_CLIENT_ID=$NEXT_PUBLIC_COGNITO_CLIENT_ID" >> .env.production
            echo "NEXT_PUBLIC_COGNITO_REGION=$NEXT_PUBLIC_COGNITO_REGION" >> .env.production
            echo "ADMIN_EMAILS=$ADMIN_EMAILS" >> .env.production
            echo "NEXT_PUBLIC_ADMIN_EMAILS=$NEXT_PUBLIC_ADMIN_EMAILS" >> .env.production
            echo "GMAIL_USER=$GMAIL_USER" >> .env.production
            echo "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD" >> .env.production
            echo "ADMIN_PHONE=$ADMIN_PHONE" >> .env.production
            echo "AWS_S3_BUCKET=$AWS_S3_BUCKET" >> .env.production
            echo "AWS_S3_REGION=$AWS_S3_REGION" >> .env.production
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> .env.production
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> .env.production
            echo "FAL_KEY=$FAL_KEY" >> .env.production
            echo "GOOGLE_GEMINI_API_KEY=$GOOGLE_GEMINI_API_KEY" >> .env.production
            echo "OPENWEATHER_API_KEY=$OPENWEATHER_API_KEY" >> .env.production
            npx prisma generate
            npx prisma db push --skip-generate --accept-data-loss
            npx prisma db seed
          fi
    build:
      commands:
        - |
          if [ "${BUILD_ADMIN}" = "true" ]; then
            # Build runs from admin-app/ (cd persists within the same shell block).
            # next.config.js sets outputFileTracingRoot=admin-app/, so Next.js writes:
            #   relativeAppDir="" in required-server-files.json
            #   server.js at admin-app/.next/standalone/server.js
            # The generic WEB_COMPUTE bootstrap (framework: null) hardcodes
            #   node standalone/server.js
            # so server.js must live at .next/standalone/server.js — correct.
            cd admin-app && npm run build
            # Copy admin-app/.next → repo-root .next so baseDirectory: .next picks it up.
            # After the cd above, CWD is admin-app/, so ".." is the repo root.
            rm -rf ../.next
            cp -r .next ../.next
          else
            npm run build
          fi
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
      - admin-app/node_modules/**/*
      - admin-app/.next/cache/**/*
